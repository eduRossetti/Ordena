name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Um run por PR/branch: um push novo cancela o anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint e formatação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test:
    name: Testes (Jest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ordena
          POSTGRES_PASSWORD: ordena
          POSTGRES_DB: ordena_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ordena -d ordena_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ordena:ordena@localhost:5432/ordena_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Não usa `npm test`: ele sobe o Postgres via Docker Compose, aqui é o service container.
      - run: npm run test:unit
      - run: npm run test:integration

  build:
    name: Build (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
