name: Migrations

# Aplica `prisma migrate deploy` no banco do ambiente escolhido.
# - PR para a main que mexe em migrations/schema: aplica em hml (o preview da Vercel usa esse banco).
# - push na main que mexe em migrations/schema: aplica em produção.
# - disparo manual (Actions → Migrations → Run workflow): escolhe hml ou produção.
# A URL de cada banco fica no secret `DATABASE_URL` do GitHub Environment correspondente
# (Settings → Environments → hml / production). Nunca no código.
on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/prisma/migrations/**'
      - 'infra/prisma/schema.prisma'
      - 'prisma.config.js'
      - '.github/workflows/migrate.yml'
  push:
    branches: [main]
    paths:
      - 'infra/prisma/migrations/**'
      - 'infra/prisma/schema.prisma'
      - 'prisma.config.js'
      - '.github/workflows/migrate.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Banco que vai receber as migrations
        type: choice
        options: [hml, production]
        default: hml

permissions:
  contents: read

jobs:
  migrate:
    name: Migrate (${{ inputs.environment || (github.event_name == 'pull_request' && 'hml') || 'production' }})
    runs-on: ubuntu-latest
    # PR de fork não recebe secrets: pula em vez de falhar.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment: ${{ inputs.environment || (github.event_name == 'pull_request' && 'hml') || 'production' }}
    # Nunca cancela uma migration em andamento: a próxima espera na fila.
    concurrency:
      group: migrate-${{ inputs.environment || (github.event_name == 'pull_request' && 'hml') || 'production' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Aplicar migrations
        run: npx prisma migrate deploy --config prisma.config.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
