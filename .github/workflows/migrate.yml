name: Migrations (manual)

# As migrations são aplicadas automaticamente no build da Vercel (script `vercel-build`):
# Production migra o banco de produção e Preview migra o de hml, cada um pela sua DATABASE_URL.
# Este workflow é só para rodar à mão quando precisar (Actions → Migrations (manual) → Run workflow),
# por exemplo para reaplicar ou conferir um banco sem fazer deploy.
# A URL de cada banco fica no secret `DATABASE_URL` do GitHub Environment correspondente
# (Settings → Environments → hml / production). Nunca no código.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Banco que vai receber as migrations
        type: choice
        options: [hml, production]
        default: hml

permissions:
  contents: read

jobs:
  migrate:
    name: Migrate (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # Nunca cancela uma migration em andamento: a próxima espera na fila.
    concurrency:
      group: migrate-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Aplicar migrations
        run: npx prisma migrate deploy --config prisma.config.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
